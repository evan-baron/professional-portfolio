<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>New Portfolio Contact</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0c0f; font-family: 'Courier New', Courier, monospace; color:#e9e6df;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0c0f; padding: 32px 0;">
		<tr>
			<td align="center">
				<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#12151a; border:1px solid #232830; border-radius:8px; overflow:hidden;">
					<tr>
						<td style="padding:20px 28px; background-color:#171b22; border-bottom:1px solid #232830;">
							<span style="color:#f2b153; font-size:13px; letter-spacing:0.04em;">// new-message.tsx</span>
						</td>
					</tr>
					<tr>
						<td style="padding:28px;">
							<h1 style="font-size:20px; margin:0 0 20px; color:#e9e6df;">New portfolio contact</h1>
							<p style="margin:0 0 6px; font-size:13px; color:#7fd9c4;">from</p>
							<p style="margin:0 0 18px; font-size:15px;">{{name}} &lt;{{email}}&gt;</p>
							<p style="margin:0 0 6px; font-size:13px; color:#7fd9c4;">message</p>
							<p style="margin:0; font-size:15px; line-height:1.7; white-space:pre-wrap;">{{message}}</p>
						</td>
					</tr>
					<tr>
						<td style="padding:16px 28px; background-color:#171b22; border-top:1px solid #232830; font-size:12px; color:#565f6c;">
							Sent from evanbaron.dev contact form
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
